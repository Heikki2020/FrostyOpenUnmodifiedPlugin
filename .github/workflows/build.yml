name: Build plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      frosty_repo:
        description: 'Frosty repository to build against'
        default: 'CadeEvs/FrostyToolsuite'
      frosty_ref:
        description: 'Tag or branch of that repository'
        default: '1.0.6.3'

env:
  FROSTY_REPO: ${{ inputs.frosty_repo || 'CadeEvs/FrostyToolsuite' }}
  FROSTY_REF: ${{ inputs.frosty_ref || '1.0.6.3' }}
  CONFIGURATION: Release - Final

jobs:
  build:
    # WPF / .NET Framework 4.8 and the C++/CLI FrostyHash project need Windows + Visual Studio
    runs-on: windows-2022
    permissions:
      contents: write   # only used to attach the dll to a release on v* tags

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Checkout Frosty ${{ env.FROSTY_REF }}
        uses: actions/checkout@v5
        with:
          repository: ${{ env.FROSTY_REPO }}
          ref: ${{ env.FROSTY_REF }}
          path: frosty

      # The csproj references ..\..\FrostyControls etc., so it must sit in <frosty>\Plugins\
      - name: Place plugin inside the Frosty tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frosty/Plugins/OpenUnmodifiedPlugin | Out-Null
          Copy-Item plugin/* frosty/Plugins/OpenUnmodifiedPlugin -Recurse -Exclude .git,.github

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        shell: pwsh
        working-directory: frosty/Plugins/OpenUnmodifiedPlugin
        run: >
          msbuild OpenUnmodifiedPlugin.csproj -restore
          /p:Configuration="${{ env.CONFIGURATION }}"
          /p:Platform=x64
          /v:minimal

      - name: Collect output
        shell: pwsh
        run: |
          $dll = Get-ChildItem frosty/Plugins/OpenUnmodifiedPlugin -Recurse -Filter OpenUnmodifiedPlugin.dll |
                 Where-Object { $_.FullName -like '*bin*' } | Select-Object -First 1
          if (-not $dll) { throw 'OpenUnmodifiedPlugin.dll was not produced' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $dll.FullName out/
          Get-ChildItem out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUnmodifiedPlugin-${{ env.FROSTY_REF }}
          path: out/OpenUnmodifiedPlugin.dll
          if-no-files-found: error

      - name: Attach to release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/OpenUnmodifiedPlugin.dll
